<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="sky4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#091c12"/>
      <stop offset="100%" stop-color="#133522"/>
    </linearGradient>
    <linearGradient id="goldAcc4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#93c5a8"/>
      <stop offset="100%" stop-color="#528c68"/>
    </linearGradient>
    <pattern id="surveyGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(197, 160, 89, 0.15)" stroke-width="0.8"/>
    </pattern>
  </defs>
  <rect width="600" height="400" fill="url(#sky4)"/>
  
  <!-- Industrial Land Survey Cadastral Layout (Port Harcourt) -->
  <g transform="translate(60, 60)">
    <!-- Survey Cadastral Boundary Polygon (4.5 Hectares) -->
    <polygon points="40,80 440,40 400,240 60,260" fill="#143623" stroke="url(#greenAcc4)" stroke-width="2.5"/>
    <polygon points="40,80 440,40 400,240 60,260" fill="url(#surveyGrid)"/>

    <!-- Boundary Survey Beacons (Pillars) -->
    <circle cx="40" cy="80" r="6" fill="#93c5a8"/>
    <circle cx="440" cy="40" r="6" fill="#93c5a8"/>
    <circle cx="400" cy="240" r="6" fill="#93c5a8"/>
    <circle cx="60" cy="260" r="6" fill="#93c5a8"/>

    <!-- Pillar Labels -->
    <text x="30" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#93c5a8">PB 1042</text>
    <text x="445" y="35" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#93c5a8">PB 1043</text>
    <text x="410" y="255" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#93c5a8">PB 1044</text>
    <text x="40" y="275" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#93c5a8">PB 1045</text>

    <!-- Center Compass Rose / Theodolite North Arrow -->
    <g transform="translate(240, 150)">
      <circle cx="0" cy="0" r="35" fill="none" stroke="url(#greenAcc4)" stroke-width="1" stroke-dasharray="3,2"/>
      <polygon points="0,-30 6,0 0,6 -6,0" fill="#93c5a8"/>
      <polygon points="0,30 6,0 0,6 -6,0" fill="#133522" stroke="#93c5a8" stroke-width="0.8"/>
      <text x="0" y="-36" font-family="'Cinzel', serif" font-size="11" font-weight="700" fill="#93c5a8" text-anchor="middle">N</text>
      <text x="0" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#ffffff" text-anchor="middle">4.5 HECTARES</text>
      <text x="0" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" fill="#93c5a8" text-anchor="middle">TRANS-AMADI INDUSTRIAL</text>
    </g>
  </g>

  <!-- Badges -->
  <rect x="20" y="20" width="165" height="24" rx="3" fill="#091c12" stroke="url(#greenAcc4)" stroke-width="1"/>
  <text x="102" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#93c5a8" text-anchor="middle" letter-spacing="1">LISTING PREVIEW</text>

  <rect x="440" y="20" width="140" height="24" rx="3" fill="#091c12" opacity="0.9"/>
  <text x="510" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#ffffff" text-anchor="middle">LAND</text>
</svg>
