<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#122f1f"/>
      <stop offset="100%" stop-color="#081810"/>
    </linearGradient>
    <linearGradient id="greenStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5a8"/>
      <stop offset="100%" stop-color="#528c68"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad)" rx="8"/>
  
  <!-- Architectural Blueprint Grid -->
  <g opacity="0.15">
    <pattern id="smallGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#74ae8c" stroke-width="0.5"/>
    </pattern>
    <rect width="800" height="600" fill="url(#smallGrid)"/>
  </g>

  <!-- Architectural Isometric Line Drawings -->
  <g transform="translate(180, 100)">
    <!-- Base Platform -->
    <polygon points="220,380 420,280 220,180 20,280" fill="#183d28" stroke="url(#greenStroke)" stroke-width="1.5"/>
    <polygon points="220,390 420,290 420,280 220,380" fill="#0f2619" stroke="url(#greenStroke)" stroke-width="1"/>
    <polygon points="20,290 220,390 220,380 20,280" fill="#0b1c13" stroke="url(#greenStroke)" stroke-width="1"/>

    <!-- Tower Floors (Isometric) -->
    <polygon points="220,130 360,60 220,-10 80,60" fill="#204c33" stroke="url(#greenStroke)" stroke-width="1.8"/>
    <polygon points="80,60 220,130 220,330 80,260" fill="#143422" stroke="url(#greenStroke)" stroke-width="1.5"/>
    <polygon points="220,130 360,60 360,260 220,330" fill="#1b422c" stroke="url(#greenStroke)" stroke-width="1.5"/>

    <!-- Floor Dividers -->
    <line x1="80" y1="110" x2="220" y2="180" stroke="url(#greenStroke)" stroke-width="0.8" opacity="0.6"/>
    <line x1="220" y1="180" x2="360" y2="110" stroke="url(#greenStroke)" stroke-width="0.8" opacity="0.6"/>
    <line x1="80" y1="160" x2="220" y2="230" stroke="url(#greenStroke)" stroke-width="0.8" opacity="0.6"/>
    <line x1="220" y1="230" x2="360" y2="160" stroke="url(#greenStroke)" stroke-width="0.8" opacity="0.6"/>
    <line x1="80" y1="210" x2="220" y2="280" stroke="url(#greenStroke)" stroke-width="0.8" opacity="0.6"/>
    <line x1="220" y1="280" x2="360" y2="210" stroke="url(#greenStroke)" stroke-width="0.8" opacity="0.6"/>

    <!-- Surveyor Dimension Lines -->
    <line x1="45" y1="60" x2="45" y2="260" stroke="#93c5a8" stroke-width="1" stroke-dasharray="3,3"/>
    <circle cx="45" cy="60" r="3" fill="#ffffff"/>
    <circle cx="45" cy="260" r="3" fill="#ffffff"/>
    <text x="35" y="165" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#ffffff" text-anchor="end" font-weight="700">ELEVATION SURVEY</text>

    <!-- Crosshair -->
    <circle cx="220" cy="130" r="45" fill="none" stroke="#93c5a8" stroke-width="0.8" stroke-dasharray="2,2"/>
    <circle cx="220" cy="130" r="3" fill="#ffffff"/>
  </g>

  <!-- Foundation Stamp in Bottom Left -->
  <g transform="translate(60, 480)">
    <rect x="0" y="0" width="220" height="70" rx="4" fill="#0d2417" stroke="url(#greenStroke)" stroke-width="1.2"/>
    <text x="18" y="28" font-family="'Cinzel', serif" font-size="14" font-weight="700" fill="#ffffff" letter-spacing="1">1981 — FOUNDED</text>
    <text x="18" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#dcf1e5">Over Four Decades of Trust</text>
    <text x="18" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#a6c9b4">Registered Estate Surveyors &amp; Valuers</text>
  </g>

  <!-- Location Cadastral Stamp in Bottom Right -->
  <g transform="translate(520, 480)">
    <rect x="0" y="0" width="220" height="70" rx="4" fill="#0d2417" stroke="url(#greenStroke)" stroke-width="1.2"/>
    <text x="18" y="28" font-family="'Cinzel', serif" font-size="13" font-weight="700" fill="#ffffff" letter-spacing="0.5">ENUGU HEAD OFFICE</text>
    <text x="18" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#dcf1e5">9 Ogui Road, Enugu, Nigeria</text>
    <text x="18" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#a6c9b4">Verified Corporate Headquarters</text>
  </g>
</svg>
