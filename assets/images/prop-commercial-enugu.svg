<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="sky1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#091c12"/>
      <stop offset="60%" stop-color="#112f1f"/>
      <stop offset="100%" stop-color="#1a432c"/>
    </linearGradient>
    <linearGradient id="bldgGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#173b27"/>
      <stop offset="60%" stop-color="#1f4e34"/>
      <stop offset="100%" stop-color="#0e2619"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#bce0cb"/>
      <stop offset="100%" stop-color="#528c68"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#sky1)"/>
  
  <!-- Modern Commercial Office Complex Elevation (Enugu) -->
  <g transform="translate(60, 40)">
    <!-- Tower Main Mass -->
    <rect x="80" y="30" width="320" height="280" fill="url(#bldgGrad1)" stroke="url(#greenAccent)" stroke-width="1.5"/>
    <!-- Glass Curtain Wall Strips -->
    <g fill="#2d5282" opacity="0.85">
      <rect x="100" y="50" width="60" height="240" rx="2"/>
      <rect x="180" y="50" width="120" height="240" rx="2"/>
      <rect x="320" y="50" width="60" height="240" rx="2"/>
    </g>
    <!-- Window Mullions -->
    <line x1="100" y1="90" x2="380" y2="90" stroke="rgba(240,207,133,0.3)" stroke-width="1"/>
    <line x1="100" y1="130" x2="380" y2="130" stroke="rgba(240,207,133,0.3)" stroke-width="1"/>
    <line x1="100" y1="170" x2="380" y2="170" stroke="rgba(240,207,133,0.3)" stroke-width="1"/>
    <line x1="100" y1="210" x2="380" y2="210" stroke="rgba(240,207,133,0.3)" stroke-width="1"/>
    <line x1="100" y1="250" x2="380" y2="250" stroke="rgba(240,207,133,0.3)" stroke-width="1"/>
    
    <!-- Entrance Canopy with Gold Trim -->
    <polygon points="180,260 300,260 320,290 160,290" fill="#081424" stroke="url(#greenAccent)" stroke-width="1.5"/>
    <rect x="210" y="270" width="60" height="40" fill="#93c5a8" opacity="0.6"/>
  </g>

  <!-- Ground Plane & Landscaping -->
  <rect x="0" y="350" width="600" height="50" fill="#09182a"/>
  <line x1="0" y1="350" x2="600" y2="350" stroke="url(#greenAccent)" stroke-width="2"/>
  
  <!-- Demonstration Preview Badge -->
  <rect x="20" y="20" width="165" height="24" rx="3" fill="#091c12" stroke="url(#greenAccent)" stroke-width="1"/>
  <text x="102" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#93c5a8" text-anchor="middle" letter-spacing="1">LISTING PREVIEW</text>

  <rect x="440" y="20" width="140" height="24" rx="3" fill="#091c12" opacity="0.9"/>
  <text x="510" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#ffffff" text-anchor="middle">COMMERCIAL</text>
</svg>
