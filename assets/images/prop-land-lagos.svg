<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="sky6" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#091c12"/>
      <stop offset="100%" stop-color="#143824"/>
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#194930"/>
      <stop offset="100%" stop-color="#0a2114"/>
    </linearGradient>
    <linearGradient id="goldAcc6" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#93c5a8"/>
      <stop offset="100%" stop-color="#528c68"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#sky6)"/>
  
  <!-- Lekki Waterfront Mixed Use Land Cadastral Parcel -->
  <!-- Lagoon Water Frontage -->
  <path d="M 0 260 Q 150 240, 300 270 T 600 250 L 600 400 L 0 400 Z" fill="url(#waterGrad)"/>
  <path d="M 0 280 Q 180 265, 340 290 T 600 270" stroke="rgba(223, 186, 110, 0.4)" stroke-width="1.2" fill="none"/>

  <!-- Prime Waterfront Land Plot -->
  <g transform="translate(60, 40)">
    <!-- Sandfilled Plot Boundary -->
    <polygon points="60,60 420,50 380,210 40,210" fill="#173b27" stroke="url(#greenAcc6)" stroke-width="2.5"/>
    
    <!-- Survey Coordinate Grid -->
    <line x1="150" y1="58" x2="130" y2="210" stroke="rgba(223,186,110,0.2)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="250" y1="55" x2="230" y2="210" stroke="rgba(223,186,110,0.2)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="340" y1="52" x2="320" y2="210" stroke="rgba(223,186,110,0.2)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="50" y1="130" x2="400" y2="130" stroke="rgba(223,186,110,0.2)" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- Survey Beacons -->
    <circle cx="60" cy="60" r="5" fill="#93c5a8"/>
    <circle cx="420" cy="50" r="5" fill="#93c5a8"/>
    <circle cx="380" cy="210" r="5" fill="#93c5a8"/>
    <circle cx="40" cy="210" r="5" fill="#93c5a8"/>

    <!-- Plot Specification Note -->
    <rect x="130" y="90" width="210" height="60" rx="3" fill="#071322" stroke="url(#greenAcc6)" stroke-width="1"/>
    <text x="235" y="112" font-family="'Cinzel', serif" font-size="11" font-weight="700" fill="#93c5a8" text-anchor="middle">LEKKI WATERFRONT PARCEL</text>
    <text x="235" y="128" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">2,150 SQ M &bull; C OF O TITLE</text>
    <text x="235" y="140" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#94a3b8" text-anchor="middle">SUITABLE FOR MIXED-USE / LUXURY RESIDENTIAL</text>
  </g>

  <!-- Badges -->
  <rect x="20" y="20" width="165" height="24" rx="3" fill="#091c12" stroke="url(#greenAcc6)" stroke-width="1"/>
  <text x="102" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#93c5a8" text-anchor="middle" letter-spacing="1">LISTING PREVIEW</text>

  <rect x="440" y="20" width="140" height="24" rx="3" fill="#091c12" opacity="0.9"/>
  <text x="510" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#ffffff" text-anchor="middle">LAND</text>
</svg>
