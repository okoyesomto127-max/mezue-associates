<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="sky5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#091c12"/>
      <stop offset="100%" stop-color="#143824"/>
    </linearGradient>
    <linearGradient id="terraceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#173b27"/>
      <stop offset="100%" stop-color="#0e2619"/>
    </linearGradient>
    <linearGradient id="goldAcc5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#93c5a8"/>
      <stop offset="100%" stop-color="#528c68"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#sky5)"/>
  
  <!-- Executive Serviced Terrace Duplex (Old GRA, Enugu) -->
  <g transform="translate(50, 70)">
    <!-- Terrace Row Units -->
    <rect x="50" y="80" width="130" height="180" fill="url(#terraceGrad)" stroke="url(#greenAcc5)" stroke-width="1.5"/>
    <rect x="185" y="80" width="130" height="180" fill="url(#terraceGrad)" stroke="url(#greenAcc5)" stroke-width="1.5"/>
    <rect x="320" y="80" width="130" height="180" fill="url(#terraceGrad)" stroke="url(#greenAcc5)" stroke-width="1.5"/>

    <!-- Pitched Roof Lines -->
    <polygon points="45,80 115,35 185,80" fill="#0b1726" stroke="url(#greenAcc5)" stroke-width="1.5"/>
    <polygon points="180,80 250,35 320,80" fill="#0b1726" stroke="url(#greenAcc5)" stroke-width="1.5"/>
    <polygon points="315,80 385,35 455,80" fill="#0b1726" stroke="url(#greenAcc5)" stroke-width="1.5"/>

    <!-- Balconies & French Windows -->
    <g fill="#375d8d" opacity="0.8">
      <rect x="70" y="100" width="40" height="50" rx="1"/>
      <rect x="120" y="100" width="40" height="50" rx="1"/>
      <rect x="205" y="100" width="40" height="50" rx="1"/>
      <rect x="255" y="100" width="40" height="50" rx="1"/>
      <rect x="340" y="100" width="40" height="50" rx="1"/>
      <rect x="390" y="100" width="40" height="50" rx="1"/>
    </g>

    <!-- Ground Entrances -->
    <rect x="100" y="200" width="30" height="60" fill="#081424" stroke="url(#greenAcc5)" stroke-width="1"/>
    <rect x="235" y="200" width="30" height="60" fill="#081424" stroke="url(#greenAcc5)" stroke-width="1"/>
    <rect x="370" y="200" width="30" height="60" fill="#081424" stroke="url(#greenAcc5)" stroke-width="1"/>
  </g>

  <!-- Ground Plane -->
  <rect x="0" y="330" width="600" height="70" fill="#09182a"/>
  <line x1="0" y1="330" x2="600" y2="330" stroke="url(#greenAcc5)" stroke-width="2"/>
  
  <!-- Badges -->
  <rect x="20" y="20" width="165" height="24" rx="3" fill="#091c12" stroke="url(#greenAcc5)" stroke-width="1"/>
  <text x="102" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#93c5a8" text-anchor="middle" letter-spacing="1">LISTING PREVIEW</text>

  <rect x="440" y="20" width="140" height="24" rx="3" fill="#091c12" opacity="0.9"/>
  <text x="510" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#ffffff" text-anchor="middle">RESIDENTIAL</text>
</svg>
