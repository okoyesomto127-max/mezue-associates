<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="sky2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#091c12"/>
      <stop offset="100%" stop-color="#143824"/>
    </linearGradient>
    <linearGradient id="villaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#173b27"/>
      <stop offset="100%" stop-color="#0e2619"/>
    </linearGradient>
    <linearGradient id="goldAcc2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#bce0cb"/>
      <stop offset="100%" stop-color="#528c68"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#sky2)"/>
  
  <!-- Contemporary Luxury Detached Duplex (Abuja) -->
  <g transform="translate(50, 70)">
    <!-- Main Villa Box -->
    <rect x="60" y="80" width="240" height="170" fill="url(#villaGrad)" stroke="url(#greenAcc2)" stroke-width="1.5"/>
    <!-- Cantilevered Upper Master Suite -->
    <polygon points="180,30 420,30 440,140 180,140" fill="#24563a" stroke="url(#greenAcc2)" stroke-width="1.8"/>
    <!-- Large Panoramic Glass Balcony -->
    <rect x="200" y="45" width="200" height="75" fill="#3b6294" opacity="0.8" stroke="rgba(240,207,133,0.6)" stroke-width="1"/>
    <!-- Ground Level Patio & Pool Representation -->
    <rect x="180" y="210" width="180" height="40" fill="#0b1b30" stroke="url(#greenAcc2)" stroke-width="1"/>
    <rect x="340" y="225" width="140" height="25" fill="#1b4b7a" opacity="0.9"/>
    
    <!-- Feature Timber / Architectural Screening -->
    <g stroke="url(#greenAcc2)" stroke-width="1.5">
      <line x1="120" y1="90" x2="120" y2="240"/>
      <line x1="135" y1="90" x2="135" y2="240"/>
      <line x1="150" y1="90" x2="150" y2="240"/>
    </g>
  </g>

  <!-- Ground Plane -->
  <rect x="0" y="320" width="600" height="80" fill="#081424"/>
  <line x1="0" y1="320" x2="600" y2="320" stroke="url(#greenAcc2)" stroke-width="2"/>
  
  <!-- Badges -->
  <rect x="20" y="20" width="165" height="24" rx="3" fill="#091c12" stroke="url(#greenAcc2)" stroke-width="1"/>
  <text x="102" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#93c5a8" text-anchor="middle" letter-spacing="1">LISTING PREVIEW</text>

  <rect x="440" y="20" width="140" height="24" rx="3" fill="#091c12" opacity="0.9"/>
  <text x="510" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#ffffff" text-anchor="middle">RESIDENTIAL</text>
</svg>
