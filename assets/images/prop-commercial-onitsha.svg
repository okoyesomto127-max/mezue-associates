<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="sky3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#091c12"/>
      <stop offset="100%" stop-color="#143824"/>
    </linearGradient>
    <linearGradient id="plazaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#173b27"/>
      <stop offset="100%" stop-color="#0e2619"/>
    </linearGradient>
    <linearGradient id="goldAcc3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#93c5a8"/>
      <stop offset="100%" stop-color="#528c68"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#sky3)"/>
  
  <!-- Commercial Trading Plaza / Complex (Onitsha) -->
  <g transform="translate(40, 50)">
    <!-- Multi-Bay Commercial Plaza -->
    <rect x="40" y="50" width="440" height="230" fill="url(#plazaGrad)" stroke="url(#greenAcc3)" stroke-width="1.5"/>
    
    <!-- Commercial Bays / Showrooms -->
    <g fill="#1f4e34" stroke="url(#greenAcc3)" stroke-width="1">
      <rect x="60" y="70" width="80" height="190"/>
      <rect x="160" y="70" width="80" height="190"/>
      <rect x="260" y="70" width="80" height="190"/>
      <rect x="360" y="70" width="80" height="190"/>
    </g>
    
    <!-- Display Glass Panes -->
    <g fill="#4370a6" opacity="0.6">
      <rect x="70" y="140" width="60" height="110"/>
      <rect x="170" y="140" width="60" height="110"/>
      <rect x="270" y="140" width="60" height="110"/>
      <rect x="370" y="140" width="60" height="110"/>
    </g>

    <!-- Upper Signage Fascia -->
    <rect x="40" y="50" width="440" height="40" fill="#081424" stroke="url(#greenAcc3)" stroke-width="1.5"/>
    <text x="260" y="75" font-family="'Cinzel', serif" font-size="12" font-weight="700" fill="#93c5a8" text-anchor="middle" letter-spacing="2">COMMERCIAL TRADING PLAZA &bull; ONITSHA</text>
  </g>

  <!-- Ground Plane -->
  <rect x="0" y="330" width="600" height="70" fill="#09182a"/>
  <line x1="0" y1="330" x2="600" y2="330" stroke="url(#greenAcc3)" stroke-width="2"/>
  
  <!-- Badges -->
  <rect x="20" y="20" width="165" height="24" rx="3" fill="#091c12" stroke="url(#greenAcc3)" stroke-width="1"/>
  <text x="102" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#93c5a8" text-anchor="middle" letter-spacing="1">LISTING PREVIEW</text>

  <rect x="440" y="20" width="140" height="24" rx="3" fill="#091c12" opacity="0.9"/>
  <text x="510" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#ffffff" text-anchor="middle">COMMERCIAL</text>
</svg>
