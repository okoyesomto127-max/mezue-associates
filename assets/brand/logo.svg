<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 70" width="460" height="70">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dfba6e"/>
      <stop offset="50%" stop-color="#c5a059"/>
      <stop offset="100%" stop-color="#9e7b34"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f2546"/>
      <stop offset="100%" stop-color="#081426"/>
    </linearGradient>
  </defs>

  <!-- Crest Icon -->
  <g transform="translate(6, 6)">
    <!-- Outer Shield / Diamond -->
    <polygon points="28,2 54,16 54,42 28,56 2,42 2,16" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="2"/>
    <polygon points="28,6 50,18 50,40 28,52 6,40 6,18" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" stroke-dasharray="2,2"/>
    
    <!-- Surveyor Compass / Plumb Geometry -->
    <path d="M28 10 L40 40 L16 40 Z" fill="none" stroke="url(#goldGrad)" stroke-width="1.4"/>
    <circle cx="28" cy="14" r="2.5" fill="url(#goldGrad)"/>
    
    <!-- Stylized "M" Lettermark -->
    <path d="M19 44 L19 26 L28 35 L37 26 L37 44" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Foundation Year Mini Badge -->
    <text x="28" y="50" font-family="'Cinzel', 'Times New Roman', serif" font-size="5" fill="#dfba6e" text-anchor="middle" font-weight="700" letter-spacing="0.5">1981</text>
  </g>

  <!-- Typography -->
  <g transform="translate(74, 14)">
    <!-- Primary Name -->
    <text x="0" y="22" font-family="'Cinzel', 'Playfair Display', 'Times New Roman', serif" font-size="21" font-weight="700" fill="#ffffff" letter-spacing="2.8">MEZUE ASSOCIATES</text>
    
    <!-- Subtitle / Professional Designation -->
    <text x="1" y="38" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="8.5" font-weight="600" fill="#dfba6e" letter-spacing="3.2">ESTATE SURVEYORS &amp; VALUERS</text>
    
    <!-- Subtle divider & founding note -->
    <line x1="1" y1="44" x2="255" y2="44" stroke="rgba(197, 160, 89, 0.35)" stroke-width="0.8"/>
    <text x="1" y="51" font-family="'Plus Jakarta Sans', sans-serif" font-size="6.5" font-weight="500" fill="#94a3b8" letter-spacing="1.5">ESTABLISHED 1981 &bull; ENUGU HEADQUARTERS</text>
  </g>
</svg>
