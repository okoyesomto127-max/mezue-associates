<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="crestGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2d28a"/>
      <stop offset="50%" stop-color="#c5a059"/>
      <stop offset="100%" stop-color="#8c6a28"/>
    </linearGradient>
    <linearGradient id="crestNavy" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#132c4f"/>
      <stop offset="100%" stop-color="#0a192f"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- Outer Shield Frame -->
    <polygon points="60,6 108,30 108,80 60,112 12,80 12,30" fill="url(#crestNavy)" stroke="url(#crestGold)" stroke-width="3"/>
    <polygon points="60,13 101,34 101,76 60,104 19,76 19,34" fill="none" stroke="url(#crestGold)" stroke-width="1" stroke-dasharray="3,2"/>
    
    <!-- Surveying & Valuation Geometry: Compass, Arch, Horizon -->
    <circle cx="60" cy="45" r="26" fill="none" stroke="rgba(197,160,89,0.25)" stroke-width="1"/>
    <line x1="60" y1="20" x2="60" y2="70" stroke="rgba(197,160,89,0.4)" stroke-width="0.8"/>
    <line x1="35" y1="45" x2="85" y2="45" stroke="rgba(197,160,89,0.4)" stroke-width="0.8"/>

    <!-- Surveyor Compass Triangle -->
    <path d="M60 22 L82 72 L38 72 Z" fill="none" stroke="url(#crestGold)" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="60" cy="28" r="4.5" fill="url(#crestGold)"/>

    <!-- "M" Monogram -->
    <path d="M43 78 L43 50 L60 64 L77 50 L77 78" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Est. 1981 Ribbon/Badge -->
    <rect x="34" y="86" width="52" height="14" rx="2" fill="#0c1d37" stroke="url(#crestGold)" stroke-width="1.2"/>
    <text x="60" y="96.5" font-family="'Cinzel', serif" font-size="8" font-weight="700" fill="#f2d28a" text-anchor="middle" letter-spacing="1.2">EST. 1981</text>
  </g>
</svg>
